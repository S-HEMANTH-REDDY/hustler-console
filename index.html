<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Hustler</title>
    <script>
      try {
        var t = localStorage.getItem('hustler.theme') || 'dark'
        if (t !== 'light' && t !== 'dim' && t !== 'dark' && t !== 'system') {
          t = 'dark'
        }
        if (t === 'system') {
          t = matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'
        }
        document.documentElement.dataset.theme = t
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute(
            'content',
            t === 'light' ? '#eef0f5' : t === 'dim' ? '#1b1e26' : '#05060a'
          )
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
